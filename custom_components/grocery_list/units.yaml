# Developer-maintained unit definitions for structured quantities.
# Each unit has a stable id and per-locale labels (short display labels).
# Label values may be a string or one/other forms for quantity-aware display.
# Users select a unit when adding an item; the unit id is stored in item metadata.

units:
  - id: pcs
    default: true
    labels:
      en:
        one: pc
        other: pcs
      de:
        one: Stk
        other: Stk
  - id: g
    labels:
      en: g
      de: g
  - id: kg
    labels:
      en: kg
      de: kg
  - id: ml
    labels:
      en: ml
      de: ml
  - id: l
    labels:
      en: L
      de: l
  - id: jar
    labels:
      en:
        one: jar
        other: jars
      de:
        one: Glas
        other: Gläser
      es:
        one: tarro
        other: tarros
      fr:
        one: bocal
        other: bocaux
      it:
        one: barattolo
        other: barattoli
      nb:
        one: glass
        other: glass
      nl:
        one: pot
        other: potten
      pl:
        one: słoik
        other: słoiki
      pt:
        one: frasco
        other: frascos
      sv:
        one: burk
        other: burkar
  - id: pack
    labels:
      en:
        one: pack
        other: packs
      de:
        one: Packung
        other: Packungen
  - id: bottle
    labels:
      en:
        one: bottle
        other: bottles
      de:
        one: Flasche
        other: Flaschen
  - id: can
    labels:
      en:
        one: can
        other: cans
      de:
        one: Dose
        other: Dosen
  - id: bunch
    labels:
      en:
        one: bunch
        other: bunches
      de:
        one: Bund
        other: Bünde
